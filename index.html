{tag:"TODAY'S PLAN",title:"What will we learn?",body:"This report is divided into three main topics. First, we will understand haircutting. Next, we will discover different career paths. Finally, we will look at salon business opportunities.",points:["Topic 1 — Introduction to Haircutting","Topic 2 — Career Opportunities","Topic 3 — Business Opportunities"],note:"By the end, we should understand how haircutting can become a profession.",q:"hairdressing scissors salon workstation"},
{tag:"QUICK REVIEW",title:"A little review",body:"Before moving to our new topic, let’s remember our previous lesson about nail care.",points:["Question: Which nail-polish layer helps protect the nail plate and helps prevent staining?","Answer: The base coat."],note:"The base coat is applied before colored nail polish.",q:"nail base coat manicure"},
{tag:"TOPIC 1 • INTRODUCTION",title:"What is haircutting?",body:"Haircutting is the process of shaping hair by cutting different lengths at specific angles. It combines creativity, technique, and knowledge to create a style that suits the client.",points:["It changes the length and shape of hair.","It is the foundation of many hairstyles.","It requires skill and careful planning."],note:"Example: A stylist cuts long hair into a layered hairstyle.",q:"haircutting stylist cutting hair scissors"},
{tag:"THE FOUNDATION",title:"Why is a haircut important?",body:"A good haircut creates the basic shape of a hairstyle. Styling products and blow-drying can improve the look, but the haircut provides the structure.",points:["Creates the hairstyle’s shape.","Makes hair easier to manage.","Helps the style look neat even with simple styling."],note:"Example: Layers can add movement and shape to long hair.",q:"layered haircut before after hair"},
{tag:"THE SCIENCE",title:"The science of angles",body:"Haircutting uses angles and geometry. Stylists lift or position sections of hair at different angles to control the shape, weight, and layers of the haircut.",points:["Different angles create different results.","Hair position affects the final shape.","Practice helps stylists control their technique."],note:"Example: A blunt cut keeps a strong, even outline; layers create movement.",q:"haircutting elevation angles diagram"},
{tag:"CUSTOMIZATION",title:"Understanding face shapes",body:"A stylist considers the client’s face shape, hair type, and personal preference before recommending a haircut. The goal is to choose a style that makes the client feel comfortable and confident.",points:["Round","Oval","Square","Heart-shaped"],note:"Example: A client may choose soft layers or a side fringe to get the look they prefer.",q:"face shapes hairstyle guide chart", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRTGxNqecyYoqBj9D4vC5j8SnbS-_qydJN_2iqP65JXeks0WOs74Dm-KwWJ&s=10"},
{tag:"CLIENT EXPERIENCE",title:"The psychology of a haircut",body:"A haircut can affect how a person feels about their appearance. Listening carefully and understanding the client’s wishes helps create a positive salon experience.",points:["Ask what the client wants.","Explain what styles may work.","Respect the client’s choices.","Help the client feel comfortable."],note:"Example: A client feels more confident after receiving the haircut they requested.",q:"happy client hair salon haircut"},
{tag:"TOPIC 2 • CAREERS",title:"Career opportunities",body:"Haircutting offers different career paths. People can begin as trainees, develop specialist skills, work independently, or teach others.",points:["Apprentice / Junior Stylist","Senior Stylist","Barber","Color Specialist","Freelance Stylist","Platform Artist"],note:"Each career has different responsibilities and skills.",q:"hair stylist barber hair colorist professionals"},
{tag:"CAREER 01",title:"Apprentice / Junior Stylist",body:"An apprentice is a beginner who learns salon routines and develops basic skills under the guidance of experienced professionals.",points:["Assists with shampooing.","Keeps the work area clean.","Prepares tools and supplies.","Observes experienced stylists."],note:"Example: A trainee practices customer service and learns how a salon works.",q:"hair salon apprentice shampoo assistant"},
{tag:"CAREER 02",title:"Senior Stylist",body:"A senior stylist has experience and can handle a wider range of services. They work with clients, recommend styles, and perform haircuts and styling.",points:["Consults with clients.","Performs haircuts and blowouts.","Builds regular client relationships.","May guide junior staff."],note:"Example: A regular client books an appointment with their preferred stylist.",q:"professional senior hair stylist cutting hair"},
{tag:"CAREER 03",title:"Barber",body:"A barber specializes in short hairstyles and grooming, often including fades, beard trimming, and moustache shaping.",points:["Uses clippers and scissors.","Creates different fade styles.","Trims and shapes facial hair.","Maintains clean tools and equipment."],note:"Example: A barber gives a client a low fade haircut.",q:"barber fade haircut beard trim"},
{tag:"CAREER 04",title:"Color Specialist",body:"A color specialist focuses on changing and maintaining hair color. This work requires color knowledge, careful consultation, and safe product use.",points:["Applies highlights and other color services.","Plans color combinations.","Follows product instructions.","Checks hair condition and client needs."],note:"Example: A colorist creates subtle highlights or helps correct an unwanted hair color.",q:"hair colorist highlights balayage salon"},
{tag:"CAREER 05",title:"Freelance Stylist",body:"A freelance stylist works independently instead of being employed at one salon. They may travel to clients or work at special events.",points:["Brings tools and supplies to appointments.","May style hair for weddings and proms.","Manages bookings and schedules.","Builds a personal client base."],note:"Example: A mobile stylist travels to a hotel to style a wedding party.",q:"mobile freelance bridal hairstylist wedding"},
{tag:"CAREER 06",title:"Platform Artist",body:"A platform artist is an experienced professional who demonstrates techniques, teaches other stylists, or represents beauty brands at events.",points:["Demonstrates haircutting techniques.","Teaches workshops or classes.","Creates educational content.","May work with professional brands."],note:"Example: A stylist gives a live haircut demonstration at a beauty event.",q:"hair stylist stage demonstration hair show"},
{tag:"CAREER COMPARISON",title:"Choosing a career path",body:"These careers have different areas of focus. Some involve general salon services, while others specialize in barbering, coloring, mobile services, or education.",points:["Beginner: Apprentice","Experienced salon worker: Senior Stylist","Specialist: Barber or Colorist","Independent worker: Freelance Stylist","Educator: Platform Artist"],note:"A person can continue learning and move into different roles over time.",q:"hairdressing career salon barber colorist"},
{tag:"TOPIC 3 • BUSINESS",title:"Business opportunities",body:"Hair professionals may eventually start or manage their own businesses. A business owner must provide good service while also managing money, supplies, staff, and customers.",points:["Independent Salon","Franchise Salon","Niche / Specialty Shop"],note:"Each business model has its own advantages and challenges.",q:"modern hair salon interior business"},
{tag:"BUSINESS MODEL 01",title:"Independent salon",body:"An independent salon is created and managed by its owner. The owner chooses the salon name, design, services, and business approach.",points:["Advantage: More creative control.","Advantage: The owner builds their own brand.","Challenge: The owner must attract customers.","Challenge: The owner handles business costs."],note:"Example: A local salon opened under the owner’s own name.",q:"independent small hair salon interior"},
{tag:"BUSINESS MODEL 02",title:"Franchise salon",body:"An franchise salon operates using an established company’s brand and business system. The owner follows the brand’s rules and pays fees according to the agreement.",points:["Advantage: Customers may already know the brand.","Advantage: The business has an existing system.","Challenge: Less freedom to change the brand.","Challenge: Franchise fees and rules apply."],note:"Example: A salon branch operating under a recognized salon brand.",q:"hair salon franchise branded interior"},
{tag:"BUSINESS MODEL 03",title:"Niche / Specialty shop",body:"A niche shop focuses on one specific service or customer group instead of offering every type of salon service.",points:["Blow-dry bar: washing and styling hair.","Kids’ salon: services designed for children.","Specialty shop: focuses on a particular service."],note:"Example: A blow-dry bar helps clients prepare their hair for an event.",q:"blow dry bar salon interior"},

{tag:"LET'S REVIEW",title:"The Stylist Economy Audit",body:"It is time to check what we learned. Write your answers on paper. Try to answer each question before looking at the answer on the next page.",points:["There are 10 review questions.","Write the exact career, concept, or business term.","Check your answers after each question."],note:"Ready? Let’s begin!",q:"student classroom quiz notebook"},
{tag:"QUESTION 01–02",title:"Check your knowledge",body:"1. What subject involving degrees and angles is a foundation of haircutting?\n\n2. What feature should a stylist analyze to help choose a suitable haircut?",points:["Think about the science behind cutting hair.","Think about the client’s facial features."],note:"Answers are on the next page.",q:"haircutting angle geometry face shape chart"},
{tag:"ANSWER 01–02",title:"The answers",body:"1. Geometry (math and angles).\n\n2. Face shape.",points:["Geometry helps explain haircutting angles.","Face shape is one factor considered during consultation."],note:"Keep going — there are eight more questions!",q:"haircutting geometry diagram face shape"},
{tag:"QUESTION 03–05",title:"Career questions",body:"3. What is the entry-level career where a beginner learns and assists in a salon?\n\n4. Which professional specializes in fades and facial-hair grooming?\n\n5. Who specializes in hair coloring and highlights?",points:["One is a beginner role.","One focuses on grooming.","One focuses on hair color."],note:"Answers are on the next page.",q:"salon apprentice barber hair colorist"},

{tag:"ANSWER 06–08",title:"The answers",body:"6. Freelance / Mobile Stylist.\n\n7. Platform Artist.\n\n8. Independent Salon.",points:["Freelance stylists travel to clients.","Platform artists teach and demonstrate.","Independent salons create their own brand."],note:"Only two questions remain!",q:"mobile hairstylist hair educator salon"},

let current=0,animating=false;
const pages=[...document.querySelectorAll('.slide')];
function show(n){
 if(animating||n===current||n<0||n>=pages.length)return;
 animating=true;const old=pages[current],next=pages[n];old.classList.remove('active');old.classList.add('exit-left');
